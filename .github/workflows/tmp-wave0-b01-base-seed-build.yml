name: tmp-wave0-b01-base-seed-build

on:
  push:
    branches:
      - data/shrine-expansion-wave0-b01-data-build
    paths:
      - .github/workflows/tmp-wave0-b01-base-seed-build.yml

permissions:
  contents: write

jobs:
  append-base-seed:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: data/shrine-expansion-wave0-b01-data-build
          fetch-depth: 0

      - name: Append W0-B01 rows safely
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('backend/temples/data/shrines_seed_clean.json')
          before = path.read_text(encoding='utf-8')
          old = json.loads(before)

          rows = [
              {
                  'name_jp': '三輪神社',
                  'address': '愛知県名古屋市中区大須3-9-32',
                  'latitude': 35.1608797,
                  'longitude': 136.9054313,
                  'goriyaku': '厄除け',
                  'goriyaku_tags': ['厄除け'],
                  'kyusei': None,
                  'astro_elements': [],
                  'location': {'lat': 35.1608797, 'lng': 136.9054313},
                  'visit_style_tags': [],
              },
              {
                  'name_jp': '大鳥大社',
                  'address': '大阪府堺市西区鳳北町1-1-2',
                  'latitude': 34.536778,
                  'longitude': 135.460861,
                  'goriyaku': '家内安全・厄除け・安産・勝運・合格祈願・商売繁盛',
                  'goriyaku_tags': ['家内安全', '厄除け', '安産', '勝運', '合格祈願', '商売繁盛'],
                  'kyusei': None,
                  'astro_elements': [],
                  'location': {'lat': 34.536778, 'lng': 135.460861},
                  'visit_style_tags': [],
              },
              {
                  'name_jp': '御岩神社',
                  'address': '茨城県日立市入四間町752',
                  'latitude': 36.63614,
                  'longitude': 140.58516,
                  'goriyaku': '安産・家内安全・厄除け・開運・病気平癒・商売繁盛・縁結び',
                  'goriyaku_tags': ['安産', '家内安全', '厄除け', '開運', '病気平癒', '商売繁盛', '縁結び'],
                  'kyusei': None,
                  'astro_elements': [],
                  'location': {'lat': 36.63614, 'lng': 140.58516},
                  'visit_style_tags': [],
              },
              {
                  'name_jp': '烏森神社',
                  'address': '東京都港区新橋2-15-5',
                  'latitude': 35.666443,
                  'longitude': 139.756134,
                  'goriyaku': '商売繁盛・技芸上達・家内安全・勝運',
                  'goriyaku_tags': ['商売繁盛', '技芸上達', '家内安全', '勝運'],
                  'kyusei': None,
                  'astro_elements': [],
                  'location': {'lat': 35.666443, 'lng': 139.756134},
                  'visit_style_tags': [],
              },
              {
                  'name_jp': '榴岡天満宮',
                  'address': '宮城県仙台市宮城野区榴ケ岡105-3',
                  'latitude': 38.260624,
                  'longitude': 140.893021,
                  'goriyaku': '合格祈願・学業成就・厄除け・安産・交通安全・商売繁盛',
                  'goriyaku_tags': ['合格祈願', '学業成就', '厄除け', '安産', '交通安全', '商売繁盛'],
                  'kyusei': None,
                  'astro_elements': [],
                  'location': {'lat': 38.260624, 'lng': 140.893021},
                  'visit_style_tags': [],
              },
          ]

          old_ids = {(row.get('name_jp'), row.get('address')) for row in old}
          new_ids = {(row['name_jp'], row['address']) for row in rows}
          assert len(new_ids) == 5
          assert not (old_ids & new_ids), f'already exists: {old_ids & new_ids}'

          closing = before.rfind('\n]')
          assert closing >= 0, 'JSON closing bracket not found'
          suffix = before[closing + 2:]
          assert suffix in ('', '\n'), repr(suffix)

          formatted = json.dumps(rows, ensure_ascii=False, indent=2)
          inner = '\n'.join(formatted.splitlines()[1:-1])
          after = before[:closing] + ',\n' + inner + '\n]' + suffix

          parsed = json.loads(after)
          assert parsed[:len(old)] == old
          assert parsed[len(old):] == rows
          assert len(parsed) == len(old) + 5
          assert len({(row.get('name_jp'), row.get('address')) for row in parsed}) == len(parsed)

          path.write_text(after, encoding='utf-8')
          print(f'base-seed rows: {len(old)} -> {len(parsed)}')
          PY

      - name: Verify and commit only Base Seed
        run: |
          git diff --check -- backend/temples/data/shrines_seed_clean.json
          if git diff --quiet -- backend/temples/data/shrines_seed_clean.json; then echo 'no seed change'; exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/temples/data/shrines_seed_clean.json
          git commit -m 'data: W0-B01 5社をBase Shrine Seedへ追加'
          git push origin HEAD:data/shrine-expansion-wave0-b01-data-build
